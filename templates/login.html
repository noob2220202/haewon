<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>채윰 패널 · 로그인</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: #06060f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 60% 20%, rgba(139,92,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 20% 80%, rgba(34,211,238,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 360px;
      padding: 16px;
    }
    .box {
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px 32px 32px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-fish {
      font-size: 40px;
      display: block;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 20px rgba(139,92,246,0.5));
    }
    .logo h1 {
      font-size: 19px;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.4px;
    }
    .logo p { font-size: 12px; color: #475569; margin-top: 4px; }
    .error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12.5px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    label { display: block; font-size: 11.5px; font-weight: 600; color: #94a3b8; margin-bottom: 7px; letter-spacing: .4px; text-transform: uppercase; }
    .input-wrap { position: relative; }
    .input-wrap i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #475569; font-size: 15px; }
    input[type=password] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      color: #f1f5f9;
      border-radius: 10px;
      padding: 11px 12px 11px 36px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .18s, background .18s;
    }
    input[type=password]:focus {
      border-color: #8b5cf6;
      background: rgba(139,92,246,0.08);
    }
    button[type=submit] {
      width: 100%;
      margin-top: 18px;
      background: linear-gradient(135deg, #7c3aed, #8b5cf6);
      border: none;
      color: #fff;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: .2px;
      transition: all .18s;
    }
    button[type=submit]:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 24px rgba(139,92,246,0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <div class="logo">
        <span class="logo-fish">🎣</span>
        <h1>채윰 관리자</h1>
        <p>Admin Panel</p>
      </div>
      {% with messages = get_flashed_messages() %}{% if messages %}
        <div class="error"><i class="bi bi-exclamation-circle"></i>{{ messages[0] }}</div>
      {% endif %}{% endwith %}
      <form method="post">
        <div style="margin-bottom:6px;">
          <label>Password</label>
          <div class="input-wrap">
            <i class="bi bi-lock"></i>
            <input type="password" name="password" autofocus placeholder="비밀번호 입력">
          </div>
        </div>
        <button type="submit">로그인 →</button>
      </form>
    </div>
  </div>
</body>
</html>
