<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎣 채윰 관리자 로그인</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a1a2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #16213e; border-radius: 12px; padding: 2.5rem; width: 100%; max-width: 380px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
    .login-box h2 { color: #e0e0e0; text-align: center; margin-bottom: 1.5rem; }
    .form-control { background: #0f3460; border-color: #533483; color: #e0e0e0; }
    .form-control:focus { background: #0f3460; border-color: #7c4dff; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(124,77,255,.25); }
    .btn-primary { background: #533483; border-color: #533483; }
    .btn-primary:hover { background: #7c4dff; border-color: #7c4dff; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>🎣 채윰 관리자</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert alert-danger">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label text-light">비밀번호</label>
        <input type="password" name="password" class="form-control" autofocus placeholder="관리자 비밀번호 입력">
      </div>
      <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
  </div>
</body>
</html>
