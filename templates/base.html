<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎣 채윰 관리자 패널</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark navbar-expand-lg" style="background:#1a1a2e;">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="/">🎣 채윰 관리자</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">대시보드</a></li>
          <li class="nav-item"><a class="nav-link {% if '/users' in request.path %}active{% endif %}" href="/users">사용자</a></li>
          <li class="nav-item"><a class="nav-link {% if '/rankings' in request.path %}active{% endif %}" href="/rankings">랭킹</a></li>
          <li class="nav-item"><a class="nav-link {% if '/shop' in request.path %}active{% endif %}" href="/shop">상점</a></li>
          <li class="nav-item"><a class="nav-link {% if '/attendance' in request.path %}active{% endif %}" href="/attendance">출석</a></li>
          <li class="nav-item"><a class="nav-link {% if '/points' in request.path %}active{% endif %}" href="/points">포인트 내역</a></li>
          <li class="nav-item"><a class="nav-link {% if '/settings' in request.path %}active{% endif %}" href="/settings">설정</a></li>
        </ul>
        <a href="/logout" class="btn btn-outline-light btn-sm">로그아웃</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid mt-4 px-4">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-info alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
